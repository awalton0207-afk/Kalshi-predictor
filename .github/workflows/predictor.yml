name: Kalshi BTC predictor
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kalshi-predictor
  cancel-in-progress: false
jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Send calls
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MAX_RUNTIME_MINUTES: '340'
        run: python kalshi_15m_predictor.py
      - name: Save scorecard
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kalshi_predictions.csv || true
          git diff --cached --quiet || (git commit -m "Update scorecard" && git pull --rebase && git push)
